name: Birthday Bot

on:
  schedule:
    # KST 07:17 목표 = UTC 전날 22:17
    # GHA 지연(0~30분) 감안 시 KST 07:17~07:47 사이 실행
    - cron: '17 22 * * *'
  workflow_dispatch:

jobs:
  send-birthday:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install slack-sdk

      - run: python birthday_bot.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TZ: Asia/Seoul
