name: Birthday Bot

on:
  schedule:
    # 9시간 지연을 고려한 설정입니다.
    # UTC 15:43에 실행 예약을 걸면, 9시간 뒤인 UTC 00:43(KST 09:43)에 작동할 확률이 높습니다.
    - cron: '43 15 * * *'
  workflow_dispatch:      # 수동 테스트용

jobs:
  send-birthday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install slack-sdk
      - run: python birthday_bot.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
