name: Birthday Bot

on:
  schedule:
    # 한국 시간(KST) 오전 09:43 = UTC 00:43
    # 정각을 피해 설정하여 실행 지연을 최소화합니다.
    - cron: '43 0 * * *'
  workflow_dispatch:      # 수동 테스트용

jobs:
  send-birthday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install slack-sdk
      - run: python birthday_bot.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
